#
# Tema escuro do Lab Desktop: grafite neutro, sóbrio, de ferramenta de desenvolvedor.
# Sem matiz próprio: o "destaque" é
# quase-branco (ação primária cheia com texto invertido, foco em anel de 2 px da mesma cor). Só os estados têm cor.
# NUNCA azul nem ciano: o TesteSemAzul varre o UIManager. O TesteContraste confere os pares.
# Mesma razão do tema claro para fixar o acento e a seleção aqui (systemColor(accent) costuma ser azul).
#

