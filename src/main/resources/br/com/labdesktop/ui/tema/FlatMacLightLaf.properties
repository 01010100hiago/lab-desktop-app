#
# Tema claro do Lab Desktop: os tokens do estilo.css do painel web (DESIGN.md), em FlatLaf.
# Paleta quente (creme, grafite, bronze). NUNCA azul nem ciano: o TesteSemAzul varre o UIManager.
#
# Este arquivo SOBREPÕE o FlatMacLightLaf.properties do FlatLaf (registerCustomDefaultsSource). Cada
# variável de acento do tema base lê a cor de destaque do macOS (systemColor(accent)), que costuma ser azul;
# por isso o acento, a seleção e o foco são fixados aqui, e o app fica igual em qualquer Mac.
#

#---- tokens do painel (lidos pelos componentes próprios: UIManager.getColor("Lab.xxx")) ----

