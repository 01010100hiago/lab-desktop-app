#---- variáveis do FlatLaf ----

@background = #F5F2EB
@foreground = #1C1A16
@disabledForeground = #A39B8B
@buttonBackground = #FFFFFF
@componentBackground = #FFFFFF
@disabledComponentBackground = #F7F4EE
@menuBackground = #FFFFFF

# acento: bronze, sempre (nada de systemColor(accent))
@accentColor = #87621A
@accentFocusColor = #C9A24A80

# seleção: tom suave do próprio âmbar, texto normal por cima
@selectionBackground = #F4ECDA
@selectionForeground = #1C1A16
@selectionInactiveBackground = #EFEBE3
@selectionInactiveForeground = #1C1A16
@textSelectionBackground = #E2D2A6
@textSelectionForeground = #1C1A16
@menuSelectionBackground = #F4ECDA
@menuCheckBackground = #E2D2A6
@cellFocusColor = #C9A24A

# os NSColor do macOS que o tema base ainda referencia (todos azuis no original)
@nsControlAccentColor = #87621A
@nsSelectedContentBackgroundColor = #F4ECDA
@nsSelectedTextBackgroundColor = #E2D2A6
@nsSelectedControlColor = #E2D2A6
@nsKeyboardFocusIndicatorColor = #C9A24A80
@nsLinkColor = #87621A
@nsSystemBlueColor = #87621A
@nsSystemTealColor = #87621A
@nsSystemIndigoColor = #87621A
@nsSystemMintColor = #2A7A54
@nsSystemCyanColor = #87621A
