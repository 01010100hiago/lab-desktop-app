# QR do 2FA: grafite sobre branco nos dois temas (o leitor precisa de contraste)
Lab.qrTinta = #1B1F23
Lab.qrFundo = #FFFFFF

#---- variáveis do FlatLaf ----

@background = #F6F7F8
@foreground = #1B1F23
@disabledForeground = #9AA1A8
@buttonBackground = #FFFFFF
@componentBackground = #FFFFFF
@disabledComponentBackground = #F9FAFB
@menuBackground = #FFFFFF

# acento: o destaque (grafite), sempre (nada de systemColor(accent))
@accentColor = #26292C
@accentFocusColor = #26292C80

# seleção: cinza neutro claro, texto normal por cima
@selectionBackground = #E4E7EA
@selectionForeground = #1B1F23
