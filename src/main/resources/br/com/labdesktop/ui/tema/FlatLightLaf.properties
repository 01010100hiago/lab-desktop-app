Lab.texto3 = #60686F
Lab.textoInverso = #F9FAFB
Lab.destaque = #26292C
Lab.destaqueForte = #111315
Lab.destaqueTexto = #FFFFFF
Lab.destaqueSuave = #E4E7EA
Lab.destaqueBorda = #C6CBD0
Lab.ok = #2B7550
Lab.okSuave = #E4F1EA
Lab.atencao = #8A6200
Lab.atencaoSuave = #F7ECD8
Lab.perigo = #B3372F
Lab.perigoSuave = #F8E5E3
Lab.foco = #26292C
Lab.trilho = #E1E4E7
Lab.serie5 = #94624A
Lab.serie6 = #5F7F5F
Lab.serie7 = #8D5C74
Lab.serie8 = #6A6F73
Lab.logsBg = #FFFFFF
Lab.logsTexto = #1B1F23
