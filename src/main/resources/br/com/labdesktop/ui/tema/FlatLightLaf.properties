#
# Tema claro do Lab Desktop: neutro, sóbrio, de ferramenta de desenvolvedor.
# Sem matiz próprio: o "destaque" é grafite
# (ação primária cheia, foco em anel de 2 px da mesma cor). Só os estados têm cor (verde, âmbar, vermelho), sempre
# com ícone ou texto junto. NUNCA azul nem ciano: o TesteSemAzul varre o UIManager. O TesteContraste confere os pares.
#
# Este arquivo SOBREPÕE o FlatLightLaf.properties do FlatLaf (registerCustomDefaultsSource) e vale para o Mac, o Windows e o Linux (o LaF do Mac herda do genérico e carrega este também). Cada
# variável de acento do tema base lê a cor de destaque do macOS (systemColor(accent)), que costuma ser azul;
# por isso o acento, a seleção e o foco são fixados aqui, e o app fica igual em qualquer Mac.
#

#---- tokens do painel (lidos pelos componentes próprios: UIManager.getColor("Lab.xxx")) ----

Lab.bg = #F6F7F8
Lab.bg2 = #EEF0F1
Lab.superficie = #FFFFFF
Lab.superficie2 = #F9FAFB
Lab.superficie3 = #ECEEF0
Lab.borda = #D5D9DD
