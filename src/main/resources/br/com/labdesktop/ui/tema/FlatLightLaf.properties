@selectionInactiveForeground = #1B1F23
@textSelectionBackground = #C6CBD0
@textSelectionForeground = #1B1F23
@menuSelectionBackground = #E4E7EA
@menuCheckBackground = #C6CBD0
@cellFocusColor = #26292C


