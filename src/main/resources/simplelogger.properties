# slf4j-simple (ARQUITETURA 11.3). O arquivo de log é definido em tempo de execução
# por ConfiguracaoDeLog (org.slf4j.simpleLogger.logFile), antes do primeiro logger.
org.slf4j.simpleLogger.defaultLogLevel=info
# DEBUG e TRACE do MINA imprimem pacotes inteiros; em WARN fica o que importa.
org.slf4j.simpleLogger.log.org.apache.sshd=warn
# Servidor sem o agente instalado: o destino do túnel (127.0.0.1:7000 do servidor) recusa a conexão, e o DefaultForwarder do MINA
# registra isso como NullPointerException em WARN a cada tentativa. É esperado (o app pergunta se quer instalar o agente) e só
# polui o log; um erro de verdade do túnel aparece como falha da conexão no app, não aqui.
org.slf4j.simpleLogger.log.org.apache.sshd.common.forward.DefaultForwarder=off
org.slf4j.simpleLogger.showDateTime=true
org.slf4j.simpleLogger.dateTimeFormat=yyyy-MM-dd HH:mm:ss.SSS
org.slf4j.simpleLogger.showThreadName=true
org.slf4j.simpleLogger.showShortLogName=true
org.slf4j.simpleLogger.levelInBrackets=true
