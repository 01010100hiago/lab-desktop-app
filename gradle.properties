# O Gradle roda por padrão no JDK que achar primeiro. Rode com um JDK 21 (defina JAVA_HOME) para o build ser igual ao do app (ARQUITETURA 11.1).
# Para fixar o daemon num JDK 21 em vez de usar JAVA_HOME, descomente e ajuste o caminho:
# org.gradle.java.home=/caminho/do/jdk-21
org.gradle.caching=false
org.gradle.parallel=true
org.gradle.jvmargs=-Xmx1g -Dfile.encoding=UTF-8

# Pacote do agente (./gradlew empacotarAgente): o commit FIXADO do repositório do agente público (lab-desktop-agente, só leitura)
# de onde o pacote é montado, e a versão base (a versão do pacote é <base>-<7 primeiros dígitos do commit>).
agenteCommit=dadf957f1f824b16fa1876f74848e33ab4c4a5ae
agenteVersaoBase=0.1.0

# Versão do app: MAJOR.MINOR. A versão completa é <base>.<n>, com n = número de commits do git (git rev-list --count HEAD), calculada a cada build
# (veja ARQUITETURA, "Versão e id da compilação"). Para uma versão nova de verdade (0.2, 1.0), troque só esta linha.
labdesktop.versaoBase=0.1
