# O Gradle roda por padrão no JDK que achar primeiro. Rode com um JDK 21 (defina JAVA_HOME) para o build ser igual ao do app (ARQUITETURA 11.1).
# Para fixar o daemon num JDK 21 em vez de usar JAVA_HOME, descomente e ajuste o caminho:
# org.gradle.java.home=/caminho/do/jdk-21
org.gradle.caching=false
org.gradle.parallel=true
org.gradle.jvmargs=-Xmx1g -Dfile.encoding=UTF-8

# Pacote do agente do perfil monitor (./gradlew empacotarAgente): o commit FIXADO do repositório do agente de onde o pacote é montado
# de onde o pacote é montado
# (passe -PagenteCommit=<hash de 40 dígitos> na linha de comando) e a versão base (a versão do pacote é <base>-<7 primeiros dígitos do commit>).
# agenteCommit=<hash de 40 dígitos>
agenteVersaoBase=0.1.0
